<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Certificate Verification - AI Summit 2026</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap" rel="stylesheet">
    <!-- ✅ Confetti Library -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body { 
            font-family: 'Inter', sans-serif; 
            background: #F5F7FA; 
            display: flex; 
            flex-direction: column; 
            min-height: 100vh;
            transition: background-color 0.4s ease;
            overflow-x: hidden;
            position: relative;
        }

        /* ✅ Falling Dots Canvas Background */
        #dots-canvas {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            z-index: 0;
            pointer-events: none; /* Allows clicking through the dots */
        }

        .main-content {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
            position: relative;
            z-index: 10;
        }

        /* ✅ Shake Animation */
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            10%, 30%, 50%, 70%, 90% { transform: translateX(-15px); }
            20%, 40%, 60%, 80% { transform: translateX(15px); }
        }

        /* ✅ Pop-in Animation */
        @keyframes popIn {
            0% { transform: scale(0.8); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        /* ✅ Loading Dots Animation */
        @keyframes bounce {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1.0); }
        }

        .loading-dots { display: flex; justify-content: center; align-items: center; height: 50px; gap: 10px; margin-bottom: 20px; }
        .loading-dots div {
            width: 20px; height: 20px;
            background-color: #00C2FF;
            border-radius: 50%;
            animation: bounce 1.4s infinite ease-in-out both;
        }
        .loading-dots div:nth-child(1) { animation-delay: -0.32s; }
        .loading-dots div:nth-child(2) { animation-delay: -0.16s; }
        .loading-dots div:nth-child(3) { animation-delay: 0s; }

        .verify-card { 
            background: white; 
            max-width: 700px; 
            width: 100%; 
            border-radius: 24px; 
            box-shadow: 0 15px 40px rgba(10,37,64,0.15); 
            overflow: hidden; 
            text-align: center; 
            padding: 50px 40px; 
            position: relative;
            z-index: 10;
        }

        .animate-pop { animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
        .animate-shake { animation: shake 0.6s cubic-bezier(.36,.07,.19,.97) both; }

        .badge { 
            padding: 15px 40px; 
            border-radius: 50px; 
            font-weight: 900; 
            font-size: 32px; 
            display: inline-block; 
            margin-bottom: 25px; 
            letter-spacing: 3px; 
        }
        .success-badge { background: #10B981; color: white; box-shadow: 0 8px 20px rgba(16, 185, 129, 0.3); }
        .error-badge { background: #EF4444; color: white; box-shadow: 0 8px 20px rgba(239, 68, 68, 0.3); }

        h1 { color: #0A2540; font-size: 32px; font-weight: 900; margin-bottom: 10px; }
        h2 { color: #0A2540; font-size: 20px; font-weight: 800; margin-bottom: 5px; }
        .tagline { color: #666; font-size: 14px; font-style: italic; margin-bottom: 35px; }

        .info-container { background: #F8FAFC; border-radius: 16px; padding: 25px; margin-bottom: 35px; }
        .info-row { display: flex; justify-content: space-between; border-bottom: 1px solid #E2E8F0; padding: 15px 0; font-size: 18px; }
        .info-row:last-child { border-bottom: none; }
        .info-row span:first-child { color: #64748B; font-weight: 600; }
        .info-row span:last-child { color: #0A2540; font-weight: 800; text-align: right; }

        .btn { 
            display: inline-block; 
            background: #0A2540; 
            color: white; 
            padding: 18px 40px; 
            text-decoration: none; 
            border-radius: 12px; 
            font-weight: 800; 
            font-size: 18px;
            transition: 0.3s;
            width: 100%;
            box-shadow: 0 4px 10px rgba(10,37,64,0.2);
        }
        .btn:hover { background: #00C2FF; color: #0A2540; transform: translateY(-2px); }

        .error-msg { font-size: 16px; color: #666; margin-bottom: 20px; }

        footer { 
            background: #0A2540; color: white; text-align: center; padding: 40px 20px; 
            margin-top: auto; position: relative; z-index: 10;
        }
        footer h3 { color: #FFD700; font-size: 20px; margin-bottom: 10px; font-weight: 900; }
        footer p { opacity: 0.8; margin-bottom: 8px; font-size: 14px; }
        footer a { color: #00C2FF; text-decoration: none; font-weight: 600; transition: 0.2s; }
        footer a:hover { text-decoration: underline; color: #FFD700; }
        .footer-links { margin: 20px 0; display: flex; justify-content: center; gap: 20px; flex-wrap: wrap; }
        .footer-dev { margin-top: 25px; font-size: 13px; opacity: 0.7; border-top: 1px solid rgba(255,255,255,0.1); padding-top: 20px; }

        @media (max-width: 600px) {
            .verify-card { padding: 30px 20px; }
            .badge { font-size: 24px; padding: 12px 30px; }
            h1 { font-size: 26px; }
            .info-row { font-size: 15px; flex-direction: column; text-align: center; gap: 5px; }
            .info-row span:last-child { text-align: center; }
        }
    </style>
</head>
<body id="body-bg">

    <!-- ✅ Falling Dots Canvas -->
    <canvas id="dots-canvas"></canvas>

    <div class="main-content">
        <div class="verify-card" id="card">
            <div class="loading-dots">
                <div></div>
                <div></div>
                <div></div>
            </div>
            <p style="color:#666; font-weight:600;">Verifying Certificate...</p>
        </div>
    </div>

    <footer>
        <h3>MIU CSE CLUB</h3>
        <p>Creating Tech Leaders of Tomorrow</p>
        <p>© 2026 MIU CSE Club. All rights reserved.</p>
        <div class="footer-links">
            <a href="mailto:cse_club@manarat.ac.bd">📧 cse_club@manarat.ac.bd</a>
            <a href="https://www.facebook.com/miucseclub/" target="_blank">🌐 Facebook Page</a>
        </div>
        <div class="footer-dev">Developed with 💙 by <a href="https://github.com/afmjarif" target="_blank">AFM Jarif</a></div>
    </footer>

    <audio id="successSound" src="assets/success.mp3" preload="auto"></audio>
    <audio id="errorSound" src="assets/error.mp3" preload="auto"></audio>

    <script>
        /* ==========================================
           ✅ 1. Falling Dots Animation
           ========================================== */
        const canvas = document.getElementById('dots-canvas');
        const ctx = canvas.getContext('2d');
        
        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        let dots = [];
        const dotCount = 60; // Number of dots on screen

        for (let i = 0; i < dotCount; i++) {
            dots.push({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                radius: Math.random() * 3 + 1.5, // Size between 1.5 and 4.5
                speedX: -(Math.random() * 0.5 + 0.2), // Move Left
                speedY: Math.random() * 1.5 + 0.5,    // Move Down
                opacity: Math.random() * 0.5 + 0.2    // Fade effect
            });
        }

        function drawDots() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            dots.forEach(dot => {
                // Draw the dot
                ctx.beginPath();
                ctx.arc(dot.x, dot.y, dot.radius, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(0, 194, 255, ${dot.opacity})`; // Cyan theme
                ctx.fill();

                // Move the dot
                dot.x += dot.speedX;
                dot.y += dot.speedY;

                // ✅ Reset dot to Top-Right if it goes off screen (Left or Bottom)
                if (dot.x < -10 || dot.y > canvas.height + 10) {
                    dot.x = canvas.width + 10; // Start from right
                    dot.y = -10;               // Start from top
                }
            });

            requestAnimationFrame(drawDots);
        }
        drawDots();


        /* ==========================================
           ✅ 2. Audio Unlock & Logic
           ========================================== */
        let audioUnlocked = false;
        
        // Unlock audio on first click
        document.addEventListener('click', function() {
            if (!audioUnlocked) {
                var s = document.getElementById('successSound');
                var e = document.getElementById('errorSound');
                
                if (s) { s.volume = 0; s.play().then(() => { s.pause(); s.currentTime = 0; s.volume = 0.5; }); }
                if (e) { e.volume = 0; e.play().then(() => { e.pause(); e.currentTime = 0; e.volume = 0.5; }); }
                
                audioUnlocked = true;
            }
        });


        /* ==========================================
           ✅ 3. API Fetch & Rendering
           ========================================== */
        const API_URL = "https://script.google.com/macros/s/AKfycbzY2-Vrn2tmgsLO8H1g6tOy7tTusEWT6ZyFcsWkf3C3Q2oVz1-RC-h_df0lTst9ph-aWA/exec";
        const urlParams = new URLSearchParams(window.location.search);
        const regId = urlParams.get('id');

        if (!regId) {
            showInvalid("No Certificate ID Found in URL.");
        } else {
            const script = document.createElement('script');
            script.src = API_URL + "?action=verifyCertificate&id=" + encodeURIComponent(regId) + "&callback=renderResult&_=" + new Date().getTime();
            script.onerror = function() {
                showInvalid("Network Error. Could not connect to the database.");
            };
            document.body.appendChild(script);
        }

        function renderResult(data) {
            if (data && data.success === true && data.regId === regId) {
                showValid(data);
            } else {
                showInvalid(data && data.message ? data.message : "This certificate could not be verified.");
            }
        }

        function showValid(data) {
            const card = document.getElementById('card');
            card.classList.add('animate-pop');
            
            card.innerHTML = `
                <div class="badge success-badge">✓ VERIFIED</div>
                <h1>Certificate Verified</h1>
                <h2>MIU CSE Club Presents AI Summit 2026</h2>
                <div class="tagline">The future of jobs and education in the age of AI</div>
                <div class="info-container">
                    <div class="info-row"><span>Name</span> <span>${data.name || "N/A"}</span></div>
                    <div class="info-row"><span>Registration ID</span> <span>${data.regId || "N/A"}</span></div>
                    <div class="info-row"><span>Department</span> <span>${data.department || "N/A"}</span></div>
                    <div class="info-row"><span>Batch</span> <span>${data.batch || "N/A"}</span></div>
                    <div class="info-row"><span>Event Date</span> <span>${data.date || "N/A"}</span></div>
                </div>
                <a href="${data.certificateLink}" target="_blank" class="btn">📥 Download Certificate</a>
            `;

            playSound('successSound');
            fireConfetti();
        }

        function showInvalid(msg) {
            const card = document.getElementById('card');
            const body = document.getElementById('body-bg');

            body.style.backgroundColor = "#FEE2E2"; 
            card.classList.add('animate-shake'); 
            
            card.innerHTML = `
                <div class="badge error-badge">✖ INVALID</div>
                <h1 style="color:#991B1B;">Verification Failed</h1>
                <p class="error-msg">${msg}</p>
                <p style="color:#666; font-size:14px;">If you believe this is a mistake, please contact the MIU CSE Club.</p>
            `;

            playSound('errorSound');
        }

        function playSound(id) {
            var audio = document.getElementById(id);
            if (audio) {
                // ✅ Reset time so it can play multiple times
                audio.currentTime = 0; 
                audio.volume = 0.5;
                audio.play().catch(function(error) {
                    console.log("Audio blocked. Click screen to enable.");
                });
            }
        }

        function fireConfetti() {
            confetti({ particleCount: 150, spread: 100, origin: { y: 0.6 }, colors: ['#0A2540', '#00C2FF', '#FFD700', '#10B981', '#EF4444'] });
            setTimeout(() => { confetti({ particleCount: 80, angle: 60, spread: 70, origin: { x: 0, y: 0.7 }, colors: ['#0A2540', '#00C2FF', '#FFD700'] }); }, 250);
            setTimeout(() => { confetti({ particleCount: 80, angle: 120, spread: 70, origin: { x: 1, y: 0.7 }, colors: ['#10B981', '#EF4444', '#FFD700'] }); }, 400);
            
            var end = Date.now() + (3 * 1000);
            (function frame() {
                confetti({ particleCount: 2, angle: 90, spread: 45, origin: { x: Math.random(), y: -0.1 }, colors: ['#0A2540', '#00C2FF', '#FFD700', '#10B981', '#EF4444'], gravity: 0.8, scalar: 1.2, drift: (Math.random() - 0.5) * 1 });
                if (Date.now() < end) { requestAnimationFrame(frame); }
            }());
        }
    </script>
</body>
</html>
